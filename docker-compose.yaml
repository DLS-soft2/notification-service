# Docker Compose for local development of Notification Service.
#
# NOTE: Kafka runs in the infra repo — start it first:
#   cd ../infra/docker && docker compose -f docker-compose.kafka.yaml up -d
#
# Then start this service:
#   docker compose up --build

services:

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  notification-service:
    build: .
    ports:
      - "8004:8000"
    environment:
      REDIS_URL: redis://redis:6379/0
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - default
      - docker_default

networks:
  docker_default:
    external: true
